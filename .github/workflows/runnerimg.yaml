on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

env:
  # Per-arch images are pushed here by digest, the manifest lists for all the
  # repos are then created from those digests, see bakefile_variants.py --tags
  REGISTRY_IMAGE: ghcr.io/pvarki/actions-runner

jobs:
  build:
    # NOTE: This *must* keep using the GitHub hosted "community" runners (both the
    #       x64 and the arm64 ones), we have to be able to build the runner image
    #       even when our own ARC installation is broken.
    runs-on: ${{ matrix.runner }}
    # Build each platform natively on a runner of that arch, no QEMU needed, see
    # https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Resolve platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> ${GITHUB_ENV}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push by digest
        id: build
        if: ${{ !env.ACT }}
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
      - name: Export digest
        if: ${{ !env.ACT }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - name: Upload digest
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # NOTE: Community runner on purpose as well, see the note in the build job
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REPO }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_TOKEN }}
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Fix ref slashes
        run: |
          echo REF_NO_SLASHES=$(echo "${{ github.ref_name }}" | sed 's/\//-/g') >> ${GITHUB_ENV}
      - name: Set DOCKER_TAG_EXTRA if not main
        if: github.event.pull_request.merged != true
        run: |
          test "${{ github.ref }}" = "refs/heads/main" || echo "DOCKER_TAG_EXTRA=-$REF_NO_SLASHES" >> ${GITHUB_ENV}
          cat ${GITHUB_ENV}
      - name: Download digests
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Create manifest lists and push
        if: ${{ !env.ACT }}
        env:
          ACR_REPO: ${{ vars.ACR_REPO }}
        run: |
          mapfile -t tags < <(.github/bakefile_variants.py --tags)
          sources=()
          for digestfile in "${RUNNER_TEMP}"/digests/*; do
            sources+=("${REGISTRY_IMAGE}@sha256:$(basename "${digestfile}")")
          done
          docker buildx imagetools create "${tags[@]/#/--tag=}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"
